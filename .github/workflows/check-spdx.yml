# This workflow builds and uploads a Python package to PyPI
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Check SPDX licenses

on:
  schedule:
    # run every Wednesday at 05:00 UTC
    - cron: "0 5 * * 3" 

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        default: 'main'
permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Install project
      run: uv sync

    - name: Check for licenses
      run: |
        uv run dev/check_spdx.py

