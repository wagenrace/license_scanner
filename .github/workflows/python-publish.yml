# This workflow builds and uploads a Python package to PyPI
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Upload Python Package

on:
  push:
    branches:
      - main  # Set a branch to deploy

  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        default: 'main'
permissions:
  contents: read

jobs:
  deploy:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Install project
      run: uv sync --no-dev

    - name: Check for licenses
      run: |
        uv run --no-dev license_scanner -m whitelist 

    - name: build package
      run: |
        if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
          uv version --bump patch --bump dev="$GITHUB_RUN_NUMBER"
        fi
        uv build

    - name: Publish package
      run: uv publish --token ${{ secrets.PYPI_API_TOKEN }}
