# This workflow runs tests and license checks across multiple Python versions
# For more information see: https://docs.astral.sh/uv/guides/integration/github/

name: Tests & License Check

on:
  pull_request:
    branches:
      - main
  
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        default: 'main'
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true
    
    - name: Install project and dev dependencies
      run: |
        cd tests/integration_test/test${{ matrix.python-version }}
        uv sync --group dev --python ${{ matrix.python-version }}
        uv pip install -r tests/integration_test/requirements_${{ matrix.python-version }}.txt
        
    - name: Run license scanner
      run: |
        cd tests/integration_test/test${{ matrix.python-version }}
        uv run license_scanner -m whitelist

    - name: Run all tests
      run: |
        cd tests/integration_test/test${{ matrix.python-version }}
        uv run pytest .. -v
